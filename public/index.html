<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ai Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="brand-mark">Chatbot</span>
        <button class="icon-btn sidebar-collapse-btn" id="sidebarCollapseBtn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn" type="button" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span class="new-chat-label">New chat</span>
      </button>

      <nav class="sidebar-list" id="sidebarList" aria-label="Chat history"></nav>

      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="1.5" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22.5"></line>
            <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
            <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
            <line x1="1.5" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22.5" y2="12"></line>
            <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
            <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
          <span class="theme-toggle-label" id="themeToggleLabel">Dark mode</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- ================= MAIN ================= -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <button class="icon-btn sidebar-open-btn" id="sidebarOpenBtn" type="button" aria-label="Open sidebar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="chatInner">
          <div class="empty-state" id="emptyState">
            <h1>Say something</h1>
            <p>I am here to reponese your message.<br>how is your day!?</p>
          </div>
        </div>
      </main>

      <div class="input-bar">
        <div class="input-bar-inner">
          <div class="input-inner">
            <textarea id="composer" placeholder="Message me here..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" type="button" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="6 11 12 5 18 11"></polyline>
              </svg>
            </button>
          </div>
          <div class="hint">Ai chatbot can make mistakes..double check your answer plz</div>
        </div>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
